apiVersion: v1
kind: Pod
metadata:
  name: high-memory-pod
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: highmem
              operator: In
              values:
              - "true"
  containers:
    - name: memory-consumer
      image: busybox
      command: ["sh", "-c", "echo This pod runs on high-memory nodes && sleep 3600"]