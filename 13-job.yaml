apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
  namespace: demo-namespace
spec:
  template:
    metadata:
      labels:
        job: demo-job
    spec:
      restartPolicy: Never
      containers:
      - name: demo
        image: busybox
        command: ["sh", "-c"]
        args:
        - echo "Hello, Kubernetes!" && sleep 10