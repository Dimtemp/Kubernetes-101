apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-cache
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cache
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: cache-container
          image: redis:latest