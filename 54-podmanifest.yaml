apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: demo-container
    image: nginx
    env:
      - name: DEMO_USERNAME
        valueFrom:
          secretKeyRef:
            name: demo-secret
            key: username
      - name: DEMO_PASSWORD
        valueFrom:
          secretKeyRef:
            name: demo-secret
            key: password